# portablemind-docs — validate on MRs, refresh Context7 on every push to main (with backoff on 429).
#
# The repo is push-mirrored to github.com/portablemind-ai/docs (GitLab → Settings →
# Repository → Mirroring repositories). Context7 indexes the GitHub copy, so the
# refresh waits until the mirror shows this commit before asking Context7 to
# re-index. Needs CONTEXT7_API_KEY (context7.com/dashboard, ctx7sk-…, protected +
# masked); without it the job logs and exits green.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - validate
  - publish

variables:
  CONTEXT7_LIBRARY: /portablemind-ai/docs
  GITHUB_MIRROR: portablemind-ai/docs

validate:
  stage: validate
  image: alpine:3.20
  script:
    - apk add --no-cache jq bash git
    - jq -e '.rules | type == "array" and length > 0' context7.json > /dev/null
    - |
      long=$(jq -r '.rules[] | select(length > 300)' context7.json)
      if [ -n "$long" ]; then echo "context7.json rule over 300 chars:"; echo "$long"; exit 1; fi
    - test -f mcp/README.md && test -d mcp/tools && test -f mcp/connect.md && test -f mcp/recipes.md
    - bash scripts/build-llms-txt.sh
    - git diff --exit-code -- llms.txt || (echo "llms.txt is stale — run scripts/build-llms-txt.sh and commit" && exit 1)

context7_refresh:
  stage: publish
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - apk add --no-cache curl jq
    - |
      if [ -z "$CONTEXT7_API_KEY" ]; then
        echo "CONTEXT7_API_KEY not set — skipping Context7 refresh."
        exit 0
      fi
      # Wait for the GitHub mirror to carry this commit (push mirroring is async).
      for i in $(seq 1 30); do
        sha=$(curl -fsS "https://api.github.com/repos/${GITHUB_MIRROR}/commits/main" | jq -r .sha || true)
        [ "$sha" = "$CI_COMMIT_SHA" ] && break
        echo "mirror at ${sha:-?}, waiting for ${CI_COMMIT_SHA} ($i/30)"; sleep 10
      done
      if [ "$sha" != "$CI_COMMIT_SHA" ]; then
        echo "GitHub mirror never caught up — refresh would index a stale commit; failing so it is visible."
        exit 1
      fi
      # Context7 rate-limits refreshes (HTTP 429; context7.com/docs/api-guide recommends backoff). Six docs
      # syncs in one evening (2026-10-29) turned main red twice on a single 429 each. Back off and retry;
      # a refresh still throttled after that is NOT a docs failure — the mirror carries this commit,
      # Context7 re-indexes main on its own schedule, and the next push asks again — so say so loudly
      # and exit green. Any other non-2xx answer stays red.
      attempt=0
      while :; do
        attempt=$((attempt + 1))
        code=$(curl -sS -o /tmp/refresh.json -w '%{http_code}' -X POST https://context7.com/api/v1/refresh \
          -H "Authorization: Bearer ${CONTEXT7_API_KEY}" \
          -H "Content-Type: application/json" \
          -d "{\"libraryName\": \"${CONTEXT7_LIBRARY}\"}") || code=000
        cat /tmp/refresh.json 2>/dev/null; echo
        case "$code" in
          2*)
            echo "Context7 refresh requested for ${CONTEXT7_LIBRARY} at ${CI_COMMIT_SHORT_SHA}."
            exit 0 ;;
          429)
            if [ "$attempt" -ge 4 ]; then
              echo "WARNING: Context7 still rate-limits the refresh after ${attempt} attempts (HTTP 429)."
              echo "The GitHub mirror carries ${CI_COMMIT_SHORT_SHA}; Context7 re-indexes on its own schedule and the next push asks again."
              exit 0
            fi
            wait=$((attempt * 120))
            echo "Context7 rate-limited (HTTP 429); retrying in ${wait}s (attempt ${attempt}/4)"
            sleep "$wait" ;;
          *)
            echo "Context7 refresh failed with HTTP ${code}."
            exit 1 ;;
        esac
      done
